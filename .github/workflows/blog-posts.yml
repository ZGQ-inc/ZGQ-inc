name: Latest Blog Posts

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "*.svg"

permissions:
  contents: write

jobs:
  update-readme-with-blog:
    name: Pull latest posts with rich media
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch RSS and render cards
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://blog.zgqinc.gq/feed.xml"
          max_post_count: 5
          date_format: "yyyy-mm-dd"
          custom_tags: "thumbnail/media:thumbnail/"
          
          item_exec: |
            const fallback = 'https://raw.githubusercontent.com/ZGQ-inc/ZGQ-inc/main/banner2024_medium.png';
            post.thumbnail = (post.thumbnail && post.thumbnail.$ && post.thumbnail.$.url) ? post.thumbnail.$.url : (typeof post.thumbnail === 'string' && post.thumbnail.length > 0 ? post.thumbnail : fallback);
            if (post.categories && post.categories.length) {
              post.categories = post.categories.filter(c => !['telegram', 'CopyRightZGQInc'].includes(c)).slice(0, 3);
            }
          
          categories_template: "<code>$category</code> "
          
          template: '<tr><td width="28%" align="center" valign="middle"><a href="$url"><img src="$thumbnail" style="width:100%;max-height:115px;object-fit:cover;border-radius:6px;" alt="$title"></a></td><td width="72%" valign="middle"><a href="$url"><b>$title</b></a><br/><br/><sub>📅 <code>$date</code>&nbsp;&nbsp;🏷️ $categories</sub></td></tr>$newline'
          
          user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          commit_message: "docs: update latest blog posts with rich media cards"
          committer_name: "github-actions[bot]"
          committer_email: "github-actions[bot]@users.noreply.github.com"